[package]
name = "tcp-latency"
version = "0.8.0"
description = "A lightweight macOS multi-target TCP latency monitor with native frosted-glass HUD and objc2 AppKit integration"
authors = ["hutong"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2.3.3"
tokio = { version = "1.47", features = ["net", "time", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
