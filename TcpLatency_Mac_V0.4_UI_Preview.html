<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TCP Latency V0.4 HUD Preview</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;--bg:#f5f5f7;--panel:rgba(245,245,247,.82);--primary:rgba(0,0,0,.88);--secondary:rgba(60,60,67,.60);--border:rgba(255,255,255,.58);--shadow:rgba(0,0,0,.14);--normal:#34c759;--warning:#c77c00;--critical:#d6382f;--inactive:#8e8e93}
@media(prefers-color-scheme:dark){:root{--bg:#151517;--panel:rgba(36,36,38,.82);--primary:rgba(255,255,255,.94);--secondary:rgba(235,235,245,.58);--border:rgba(255,255,255,.12);--shadow:rgba(0,0,0,.34);--normal:#30d158;--warning:#ffd60a;--critical:#ff453a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--primary);padding:40px;min-height:100vh}.wrap{max-width:920px;margin:auto}.title{margin-bottom:26px}.title h1{margin:0 0 6px;font-size:28px;letter-spacing:-.5px}.title p{margin:0;color:var(--secondary)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}.sample{display:flex;flex-direction:column;gap:10px}.caption{font-size:12px;color:var(--secondary)}.window{width:228px;height:100px;padding:4px;background:transparent}.hud{position:relative;width:100%;height:100%;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);box-shadow:0 10px 28px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}.hud:before{content:"";position:absolute;inset:0 0 auto;height:46%;border-radius:inherit;background:linear-gradient(to bottom,rgba(255,255,255,.11),transparent)}.row{z-index:1;display:flex;align-items:baseline;min-height:48px}.value{font-size:42px;font-weight:650;letter-spacing:-1.25px;font-variant-numeric:tabular-nums}.unit{margin-left:5px;font-size:17px;font-weight:600;color:var(--secondary)}.target{z-index:1;margin-top:6px;max-width:178px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;color:var(--secondary)}.dot{position:absolute;top:13px;right:14px;width:6px;height:6px;border-radius:999px;background:var(--normal)}.warn .value{color:var(--warning)}.warn .dot{background:var(--warning)}.bad .value{font-size:27px;letter-spacing:-.45px;color:var(--critical)}.bad .dot{background:var(--critical)}.stale .value{font-size:27px;letter-spacing:-.45px;color:var(--inactive)}.stale .dot{background:var(--inactive)}
</style>
</head>
<body><div class="wrap"><div class="title"><h1>TCP Latency V0.4 · Apple-style HUD</h1><p>最终程序会跟随 macOS Light / Dark 模式；下面展示 Standard 尺寸的几种状态。</p></div><div class="grid">
<div class="sample"><div class="window"><div class="hud"><span class="dot"></span><div class="row"><span class="value">27</span><span class="unit">ms</span></div><div class="target">qq.com</div></div></div><div class="caption">Normal</div></div>
<div class="sample"><div class="window"><div class="hud warn"><span class="dot"></span><div class="row"><span class="value">86</span><span class="unit">ms</span></div><div class="target">K8s API</div></div></div><div class="caption">Warning</div></div>
<div class="sample"><div class="window"><div class="hud bad"><span class="dot"></span><div class="row"><span class="value">Timeout</span></div><div class="target">cmdb.hutong.lab</div></div></div><div class="caption">Timeout</div></div>
<div class="sample"><div class="window"><div class="hud stale"><span class="dot"></span><div class="row"><span class="value">Stale</span></div><div class="target">prod-k8s-api.internal.company.local</div></div></div><div class="caption">Stale / 长目标名自动省略</div></div>
</div></div></body></html>
