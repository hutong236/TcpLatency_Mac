name: Retag v0.9.0 for release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retag-v0.9.0.yml

permissions:
  contents: write
  actions: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v0.9.0 to the release commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="b666e44f87e73adc07cfe84b36d5ec9cee411528"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa v0.9.0 "$TARGET_SHA" -m "TCP Latency v0.9.0 - live network traffic HUD"
          git push --force origin refs/tags/v0.9.0

      - name: Dispatch macOS release workflow on v0.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-macos.yml --ref v0.9.0
