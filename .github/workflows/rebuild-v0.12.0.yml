name: Rebuild v0.12.0 Release

on:
  push:
    branches:
      - automation/rebuild-v0.12.0
    paths:
      - '.github/workflows/rebuild-v0.12.0.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release-macos.yml --repo hutong236/TcpLatency_Mac --ref main -f release_tag=v0.12.0
