name: Tag v0.12.0

on:
  push:
    branches:
      - automation/tag-v0.12.0
    paths:
      - '.github/workflows/tag-v0.12.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.12.0 tag on merged release commit
        env:
          TARGET_SHA: 26cf69195198e9402d5f66ffb6f2cd396fc356fb
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse -q --verify refs/tags/v0.12.0 >/dev/null; then
            echo 'v0.12.0 already exists; leaving it unchanged.'
          else
            git tag v0.12.0 "${TARGET_SHA}"
            git push origin refs/tags/v0.12.0
          fi

      - name: Dispatch macOS release workflow on tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release-macos.yml --ref v0.12.0
