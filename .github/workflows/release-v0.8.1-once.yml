name: Publish V0.8.1 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.8.1-once.yml'

permissions:
  contents: write

concurrency:
  group: publish-v0.8.1-once
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish v0.8.1
    runs-on: macos-15
    timeout-minutes: 45

    env:
      RELEASE_TAG: v0.8.1
      RELEASE_COMMIT: bac1eae9e4e1e7682253540302a8b55e24211580
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${RELEASE_TAG#v}"
          TAURI_VERSION="$(python3 - <<'PY'
          import json
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )"
          CARGO_VERSION="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          package = text.split('[package]', 1)[1].split('[', 1)[0]
          match = re.search(r'^version\s*=\s*"([^"]+)"', package, re.MULTILINE)
          if not match:
              raise SystemExit('Cannot find package version')
          print(match.group(1))
          PY
          )"
          test "${EXPECTED}" = "${TAURI_VERSION}"
          test "${EXPECTED}" = "${CARGO_VERSION}"
          git rev-parse HEAD | grep -qx "${RELEASE_COMMIT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Universal macOS App and DMG
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify Universal binary
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "${APP_DIR}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_DIR}/Contents/Info.plist")"
          BIN="${APP_DIR}/Contents/MacOS/${EXECUTABLE}"
          ARCHS="$(lipo -archs "${BIN}")"
          echo "Architectures: ${ARCHS}"
          [[ "${ARCHS}" == *"arm64"* ]]
          [[ "${ARCHS}" == *"x86_64"* ]]

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APP_DIR="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_FILE="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${APP_DIR}"
          test -n "${DMG_FILE}"
          APP_ZIP="release-assets/TcpLatency_Mac_${RELEASE_TAG}_universal.app.zip"
          DMG_OUT="release-assets/TcpLatency_Mac_${RELEASE_TAG}_universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "${APP_ZIP}"
          cp "${DMG_FILE}" "${DMG_OUT}"
          shasum -a 256 "${APP_ZIP}" "${DMG_OUT}" | tee release-assets/SHA256SUMS.txt
          ls -lh release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TcpLatency-Mac-universal-v0.8.1
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release and create tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading assets with clobber."
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release-assets/* \
              --target "${RELEASE_COMMIT}" \
              --title "TCP Latency ${RELEASE_TAG}" \
              --notes-file CHANGELOG_V0.8.1.md
          fi
