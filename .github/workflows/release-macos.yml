name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing tag to rebuild/publish, e.g. v0.12.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build Universal macOS App
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # Ad-hoc signing. This avoids producing a completely unsigned Apple Silicon app.
      # Later, replace this with a Developer ID signing identity + notarization secrets.
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # For a manual recovery run, build the exact tagged source while using
          # this workflow definition from the default branch.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${RELEASE_TAG#v}"

          TAURI_VERSION="$(python3 - <<'PY'
          import json
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )"

          CARGO_VERSION="$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          package = text.split('[package]', 1)[1].split('[', 1)[0]
          match = re.search(r'^version\s*=\s*"([^"]+)"', package, re.MULTILINE)
          if not match:
              raise SystemExit('Cannot find [package] version in src-tauri/Cargo.toml')
          print(match.group(1))
          PY
          )"

          echo "Release tag:   ${RELEASE_TAG}"
          echo "Tag version:   ${TAG_VERSION}"
          echo "Tauri version: ${TAURI_VERSION}"
          echo "Cargo version: ${CARGO_VERSION}"

          if [[ "${TAG_VERSION}" != "${TAURI_VERSION}" || "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "::error::Version mismatch. Tag ${RELEASE_TAG} must match src-tauri/tauri.conf.json and src-tauri/Cargo.toml."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Universal macOS App
        # Tauri's generated bundle_dmg.sh is intentionally bypassed here. It can
        # fail or hang in headless macOS runners around diskimages-helper even
        # after the .app has built successfully. Build the signed app first and
        # create the simple distributable DMG with hdiutil in a separate step.
        run: cargo tauri build --target universal-apple-darwin --bundles app

      - name: Verify Universal binary
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "${APP_DIR}" ]]; then
            echo "::error::No .app bundle found"
            exit 1
          fi

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_DIR}/Contents/Info.plist")"
          BIN="${APP_DIR}/Contents/MacOS/${EXECUTABLE}"

          echo "App bundle: ${APP_DIR}"
          echo "Executable: ${BIN}"
          file "${BIN}"

          ARCHS="$(lipo -archs "${BIN}")"
          echo "Architectures: ${ARCHS}"

          if [[ "${ARCHS}" != *"arm64"* || "${ARCHS}" != *"x86_64"* ]]; then
            echo "::error::Expected arm64 + x86_64 Universal binary, got: ${ARCHS}"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${APP_DIR}"

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          APP_DIR="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "${APP_DIR}" ]]; then
            echo "::error::No .app bundle found"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG:-manual}"
          APP_ZIP="release-assets/TcpLatency_Mac_${RELEASE_VERSION}_universal.app.zip"
          DMG_OUT="release-assets/TcpLatency_Mac_${RELEASE_VERSION}_universal.dmg"
          DMG_STAGE="$(mktemp -d "${RUNNER_TEMP}/tcplatency-dmg.XXXXXX")"

          cleanup() {
            hdiutil detach '/Volumes/TCP Latency' -force >/dev/null 2>&1 || true
            rm -rf "${DMG_STAGE}"
          }
          trap cleanup EXIT

          # ditto preserves macOS bundle metadata/resource forks better than generic zip/cp.
          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "${APP_ZIP}"
          ditto "${APP_DIR}" "${DMG_STAGE}/TCP Latency.app"
          ln -s /Applications "${DMG_STAGE}/Applications"

          # A plain hdiutil-created UDZO image is less decorative than Tauri's
          # Finder-layout DMG, but much more reliable on headless CI runners.
          # Retry transient DiskImages framework failures and always verify the result.
          created=false
          for attempt in 1 2 3; do
            echo "Creating DMG (attempt ${attempt}/3)..."
            hdiutil detach '/Volumes/TCP Latency' -force >/dev/null 2>&1 || true
            rm -f "${DMG_OUT}"

            if hdiutil create \
              -volname 'TCP Latency' \
              -srcfolder "${DMG_STAGE}" \
              -ov \
              -format UDZO \
              "${DMG_OUT}"; then
              created=true
              break
            fi

            sleep $((attempt * 3))
          done

          if [[ "${created}" != true || ! -s "${DMG_OUT}" ]]; then
            echo "::error::Failed to create DMG after 3 attempts"
            exit 1
          fi

          hdiutil verify "${DMG_OUT}"
          shasum -a 256 "${APP_ZIP}" "${DMG_OUT}" | tee release-assets/SHA256SUMS.txt

          echo 'Release assets:'
          ls -lh release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TcpLatency-Mac-universal-${{ inputs.release_tag || github.ref_name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; replacing assets."
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release-assets/* \
              --title "TCP Latency ${RELEASE_TAG}" \
              --generate-notes
          fi
