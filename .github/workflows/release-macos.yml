name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build Universal macOS App
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # Ad-hoc signing. This avoids producing a completely unsigned Apple Silicon app.
      # Later, replace this with a Developer ID signing identity + notarization secrets.
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          TAURI_VERSION="$(python3 - <<'PY'
          import json
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )"

          CARGO_VERSION="$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          package = text.split('[package]', 1)[1].split('[', 1)[0]
          match = re.search(r'^version\s*=\s*"([^"]+)"', package, re.MULTILINE)
          if not match:
              raise SystemExit('Cannot find [package] version in src-tauri/Cargo.toml')
          print(match.group(1))
          PY
          )"

          echo "Tag version:   ${TAG_VERSION}"
          echo "Tauri version: ${TAURI_VERSION}"
          echo "Cargo version: ${CARGO_VERSION}"

          if [[ "${TAG_VERSION}" != "${TAURI_VERSION}" || "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "::error::Version mismatch. Before tagging, set src-tauri/tauri.conf.json and src-tauri/Cargo.toml to ${TAG_VERSION}."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Universal macOS App and DMG
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify Universal binary
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "${APP_DIR}" ]]; then
            echo "::error::No .app bundle found"
            exit 1
          fi

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_DIR}/Contents/Info.plist")"
          BIN="${APP_DIR}/Contents/MacOS/${EXECUTABLE}"

          echo "App bundle: ${APP_DIR}"
          echo "Executable: ${BIN}"
          file "${BIN}"

          ARCHS="$(lipo -archs "${BIN}")"
          echo "Architectures: ${ARCHS}"

          if [[ "${ARCHS}" != *"arm64"* || "${ARCHS}" != *"x86_64"* ]]; then
            echo "::error::Expected arm64 + x86_64 Universal binary, got: ${ARCHS}"
            exit 1
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          APP_DIR="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_FILE="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

          if [[ -z "${APP_DIR}" ]]; then
            echo "::error::No .app bundle found"
            exit 1
          fi

          if [[ -z "${DMG_FILE}" ]]; then
            echo "::error::No .dmg bundle found"
            exit 1
          fi

          RELEASE_VERSION="${GITHUB_REF_NAME:-manual}"
          APP_ZIP="release-assets/TcpLatency_Mac_${RELEASE_VERSION}_universal.app.zip"
          DMG_OUT="release-assets/TcpLatency_Mac_${RELEASE_VERSION}_universal.dmg"

          # ditto preserves macOS bundle metadata/resource forks better than generic zip.
          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "${APP_ZIP}"
          cp "${DMG_FILE}" "${DMG_OUT}"

          shasum -a 256 "${APP_ZIP}" "${DMG_OUT}" | tee release-assets/SHA256SUMS.txt

          echo 'Release assets:'
          ls -lh release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TcpLatency-Mac-universal-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --title "TCP Latency ${GITHUB_REF_NAME}" \
            --generate-notes
