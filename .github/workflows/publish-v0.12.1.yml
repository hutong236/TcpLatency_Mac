name: Publish v0.12.1 Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publish-tag:
    name: Create v0.12.1 and dispatch release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.12.1"
          TAG_VERSION="${TAG#v}"
          TAURI_VERSION="$(python3 - <<'PY'
          import json
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )"
          CARGO_VERSION="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          package = text.split('[package]', 1)[1].split('[', 1)[0]
          match = re.search(r'^version\s*=\s*"([^"]+)"', package, re.MULTILINE)
          if not match:
              raise SystemExit('Cannot find package version')
          print(match.group(1))
          PY
          )"
          test "${TAG_VERSION}" = "${TAURI_VERSION}"
          test "${TAG_VERSION}" = "${CARGO_VERSION}"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.12.1"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "TCP Latency ${TAG} - latency measurement accuracy fix"
            git push origin "${TAG}"
          fi

      - name: Dispatch macOS release build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.12.1"
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-macos.yml/dispatches"             -d "{\"ref\":\"main\",\"inputs\":{\"release_tag\":\"${TAG}\"}}"
