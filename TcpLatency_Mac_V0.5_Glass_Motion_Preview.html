<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V0.5 Glass HUD Preview</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#b9d2f3,transparent 35%),radial-gradient(circle at 80% 70%,#dec7ef,transparent 34%),linear-gradient(135deg,#eef2f7,#d8dde6);overflow:hidden}.hud{--x:50%;--y:18%;position:relative;width:228px;height:100px;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.40),rgba(255,255,255,.17));border:1px solid rgba(255,255,255,.62);box-shadow:0 14px 36px rgba(0,0,0,.14),inset 0 0 0 1px rgba(255,255,255,.18);backdrop-filter:blur(26px) saturate(165%);-webkit-backdrop-filter:blur(26px) saturate(165%);animation:enter .24s cubic-bezier(.16,1,.3,1)}.hud:before{content:"";position:absolute;inset:-30% -20% 38%;background:radial-gradient(70% 90% at 48% 0%,rgba(255,255,255,.42),transparent 68%),linear-gradient(110deg,transparent 25%,rgba(255,255,255,.14) 47%,transparent 68%);animation:drift 8s ease-in-out infinite alternate}.hud:after{content:"";position:absolute;inset:0;background:radial-gradient(105px 70px at var(--x) var(--y),rgba(255,255,255,.28),rgba(255,255,255,.08) 35%,transparent 72%);opacity:0;transition:.18s}.hud:hover:after{opacity:1}.row{position:relative;z-index:2;display:flex;align-items:baseline}.v{font-size:42px;font-weight:650;letter-spacing:-1.25px;font-variant-numeric:tabular-nums}.u{font-size:17px;margin-left:5px;opacity:.5;font-weight:600}.target{z-index:2;margin-top:6px;font-size:13px;opacity:.48;font-weight:500}.dot{position:absolute;z-index:3;top:13px;right:14px;width:6px;height:6px;border-radius:50%;background:#34c759;box-shadow:0 0 0 2px rgba(255,255,255,.2)}@keyframes enter{from{opacity:0;transform:translateY(3px) scale(.965);filter:blur(1px)}to{opacity:1;transform:none;filter:none}}@keyframes drift{from{transform:translateX(-4%);opacity:.54}to{transform:translateX(4%);opacity:.72}}.hint{position:fixed;bottom:28px;font-size:13px;color:#555;background:rgba(255,255,255,.55);padding:8px 12px;border-radius:99px;backdrop-filter:blur(12px)}</style></head><body><div class="hud" id="hud"><span class="dot"></span><div class="row"><span class="v" id="v">27</span><span class="u">ms</span></div><div class="target">qq.com</div></div><div class="hint">移动鼠标查看玻璃反光 · 数值每 1.4 秒模拟更新</div><script>const h=document.getElementById('hud'),v=document.getElementById('v');h.onmousemove=e=>{const r=h.getBoundingClientRect();h.style.setProperty('--x',((e.clientX-r.left)/r.width*100)+'%');h.style.setProperty('--y',((e.clientY-r.top)/r.height*100)+'%')};let a=[27,31,29,46,82,36],i=0;setInterval(()=>{i=(i+1)%a.length;v.animate([{opacity:.7,transform:'translateY(1px) scale(.986)'},{opacity:1,transform:'none'}],{duration:150,easing:'ease-out'});v.textContent=a[i]},1400)</script></body></html>
